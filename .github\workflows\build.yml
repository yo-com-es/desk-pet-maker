name: Compilar y publicar Criadero Taller

# Se dispara a mano desde la pestaña "Actions" de GitHub (botón "Run workflow"),
# no hace falta terminal ni git en tu computadora.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Número de versión para esta release (ej: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run ${{ matrix.script }}

      # electron-builder deja los instaladores sueltos en release/, junto con
      # archivos auxiliares (.blockmap, carpetas -unpacked) que no sirven para
      # descargar a mano — se filtran para subir solo lo instalable.
      - name: Reunir solo los instaladores
        shell: bash
        run: |
          mkdir -p artifacts
          find release -maxdepth 1 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) -exec cp {} artifacts/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: criadero-taller-${{ matrix.os }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Criadero Taller v${{ inputs.version }}
          files: artifacts/*
